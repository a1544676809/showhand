<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="felt" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#1f815f"/>
      <stop offset="52%" stop-color="#0f5138"/>
      <stop offset="100%" stop-color="#061d16"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe6b4"/>
      <stop offset="100%" stop-color="#c1932f"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6ebf1"/>
    </linearGradient>
    <pattern id="cardBack" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="40" height="40" fill="#c02a35"/>
      <rect width="20" height="40" fill="#94161f"/>
    </pattern>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#felt)"/>

  <!-- Rail ring -->
  <circle cx="512" cy="512" r="410" fill="none" stroke="url(#gold)" stroke-width="12" opacity="0.5"/>
  <circle cx="512" cy="512" r="384" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.09"/>

  <!-- Back card -->
  <g transform="rotate(-14 512 512)" filter="url(#lift)">
    <rect x="300" y="212" width="392" height="556" rx="48" fill="url(#cardBack)"
          stroke="#f7f3ea" stroke-width="14"/>
  </g>

  <!-- Ace of spades -->
  <g transform="rotate(8 512 512)" filter="url(#lift)">
    <rect x="352" y="236" width="392" height="556" rx="48" fill="url(#cardFace)"/>

    <text x="404" y="360" font-family="Georgia, 'Times New Roman', serif"
          font-size="132" font-weight="700" fill="#12181e">A</text>

    <g transform="translate(548 560) scale(1.62)">
      <path fill="#12181e" d="M0,-100
        C -15,-68 -82,-26 -82,22
        C -82,64 -49,88 -18,79
        C -27,105 -36,122 -53,134
        L 53,134
        C 36,122 27,105 18,79
        C 49,88 82,64 82,22
        C 82,-26 15,-68 0,-100 Z"/>
    </g>
  </g>
</svg>
